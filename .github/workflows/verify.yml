name: Verify
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: |
          python -m pip install pytest PyYAML
          sudo apt-get update -qq
          sudo apt-get install -y iproute2 iputils-ping iptables apparmor-utils
      - name: Test real Linux networking
        run: sudo "$(which python)" -m pytest tests -q --tb=short
      - name: Check clean distribution
        run: |
          python tools/package.py --output "$RUNNER_TEMP/zigbee-dist"
          python tools/check_distribution.py "$RUNNER_TEMP/zigbee-dist"
      - name: Validate AppArmor syntax
        run: sudo apparmor_parser -Q zigbee_link/apparmor.txt
      - name: Build amd64 image
        run: docker build --build-arg BUILD_VERSION=1.1.0 --build-arg BUILD_ARCH=amd64 -t zigbee-link:ci zigbee_link
      - name: Verify container isolation and clean exit
        run: |
          mkdir "$RUNNER_TEMP/zigbee-data"
          printf '%s\n' '{"parent":"auto","address":"172.31.254.1/24","coordinators":[],"scan_enabled":false}' > "$RUNNER_TEMP/zigbee-data/options.json"
          docker run -d --name zigbee-check --network none --cap-drop ALL --cap-add NET_ADMIN --cap-add NET_RAW -v "$RUNNER_TEMP/zigbee-data:/data" zigbee-link:ci
          sleep 3
          test "$(docker inspect -f '{{.State.Running}}' zigbee-check)" = true
          docker logs zigbee-check
          docker stop -t 15 zigbee-check
          test "$(docker inspect -f '{{.State.ExitCode}}' zigbee-check)" = 0
          docker rm zigbee-check
  arm64-build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build native aarch64 image
        run: docker build --build-arg BUILD_VERSION=1.1.0 --build-arg BUILD_ARCH=aarch64 -t zigbee-link:arm64 zigbee_link
      - name: Verify architecture and Python imports
        run: docker run --rm --network none --cap-drop ALL --entrypoint python3 zigbee-link:arm64 -c 'import platform; import app.main; assert platform.machine() == "aarch64"'
