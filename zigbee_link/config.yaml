name: Zigbee Link
description: Stable Ethernet connection to static LAN Zigbee coordinators
version: 1.3.0
slug: zigbee_link
url: https://github.com/Stepan-fair/zigbee-link
arch:
  - amd64
  - aarch64
startup: system
boot: auto
host_network: true
privileged:
  - NET_ADMIN
  - NET_RAW
apparmor: true
init: false
timeout: 45
hassio_api: true
hassio_role: manager
ingress: true
ingress_port: 0
panel_admin: true
services:
  - mqtt:want
options:
  configuration_mode: legacy
  parent: auto
  address: 172.31.254.1/24
  coordinators: []
  scan_enabled: true
  recovery:
    enabled: false
    mqtt: {}
    networks: []
schema:
  configuration_mode: list(legacy|guided)
  parent: str
  address: str
  coordinators:
    - name: str
      ip: str
  scan_enabled: bool
  recovery:
    enabled: bool
    mqtt:
      server: str?
      username: str?
      password: password?
    networks:
      - ip: str
        addon_slug: str
        base_topic: str
        coordinator_ieee: str
        managed: bool?
        paused: bool?
        references:
          - ieee: str
            endpoint: int(1,240)
            cluster: str
            attribute: str
