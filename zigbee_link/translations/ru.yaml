configuration:
  parent:
    name: Ethernet-порт
    description: auto выбирает подходящий физический порт. При нескольких кандидатах укажите имя из журнала.
  address:
    name: Адрес HA в сети координаторов
    description: Частный статический IPv4 с маской /24. По умолчанию 172.31.254.1/24. На координаторах задайте адреса той же подсети.
  coordinators:
    name: Известные координаторы
    description: Необязательный список для диагностики. Адреса назначаются в самих координаторах; список не управляет доступом.
    fields:
      name:
        name: Название
      ip:
        name: Статический IP
  scan_enabled:
    name: Обзор сети координаторов
    description: Ограниченная ARP-проверка своей /24 подсети после подготовки. Не открывает управляющие порты устройств.
  recovery:
    name: Восстановление Zigbee-сетей
    description: Отдельная привязка каждого координатора к его Zigbee2MQTT. Поддержание запускает и вручную остановленное приложение; для ремонта включите паузу обслуживания. Переключатели применяются после сохранения без перезапуска Zigbee Link.
    fields:
      enabled:
        name: Включить контроллер восстановления
      mqtt:
        name: Подключение MQTT
      networks:
        name: Управляемые сети
        fields:
          managed:
            name: Поддерживать сеть включённой
          paused:
            name: Пауза обслуживания
          ip:
            name: IP координатора
          addon_slug:
            name: Приложение Zigbee2MQTT
          base_topic:
            name: MQTT-тема этой сети
          coordinator_ieee:
            name: IEEE координатора
          references:
            name: Контрольные устройства для проверки радио
